{% extends "base.html" %}

{% block title %}Farmer Login{% endblock %}

{% block content %}
<div class="container">
  <div class="kd-auth-wrap kd-form-card">
    <h1 class="h4 kd-section-title mb-1"><i class="bi bi-box-arrow-in-right me-1"></i>Farmer Login</h1>
    <p class="text-muted small mb-4">Login with your username, email or mobile number.</p>

    <form method="post">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <div class="mb-3">
        <label for="usernameInput" class="form-label">Username / Email / Phone</label>
        <input type="text" class="form-control" id="usernameInput" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="passwordInput" class="form-label">Password</label>
        <input type="password" class="form-control" id="passwordInput" name="password" required>
      </div>
      <button type="submit" class="btn btn-success w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
    </form>
    <p class="text-center small mt-3 mb-1">New to KrishiDisha? <a href="{{ url_for('auth.farmer_registration') }}">Register here</a></p>
    <p class="text-center small mb-0"><a href="{{ url_for('auth.admin_login') }}" class="text-muted">Admin login</a></p>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <i class="bi bi-signpost-split display-1 text-success"></i>
  <h1 class="kd-section-title mt-3">Page not found</h1>
  <p class="text-muted mb-4">The page you're looking for doesn't exist or may have moved.</p>
  <div class="d-flex justify-content-center gap-2">
    <a href="{{ url_for('main.index') }}" class="btn btn-success"><i class="bi bi-house-door me-1"></i>Go home</a>
    <a href="{{ url_for('chat.page') }}" class="btn btn-outline-success"><i class="bi bi-robot me-1"></i>Ask the assistant</a>
  </div>
</div>
{% endblock %}

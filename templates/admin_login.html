{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="container">
  <div class="kd-auth-wrap kd-form-card text-center">
    <i class="bi bi-shield-lock display-5 text-success mb-2"></i>
    <h1 class="h4 kd-section-title mb-1">Admin Login</h1>
    <p class="text-muted small mb-4">Restricted access for KrishiDisha administrators.</p>

    <form method="post" class="text-start">
      <div class="mb-3">
        <label for="usernameInput" class="form-label">Username</label>
        <input type="text" class="form-control" id="usernameInput" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="passwordInput" class="form-label">Password</label>
        <input type="password" class="form-control" id="passwordInput" name="password" required>
      </div>
      <button type="submit" class="btn btn-success w-100"><i class="bi bi-shield-lock me-1"></i>Login</button>
    </form>
    <p class="text-center small mt-3 mb-0"><a href="{{ url_for('main.index') }}">&larr; Back to home</a></p>
  </div>
</div>
{% endblock %}

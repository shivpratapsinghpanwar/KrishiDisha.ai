[project]
name = "krishidisha"
version = "2.0.0"
description = "AI decision support for Indian farmers: crop, fertilizer, disease and yield advice, weather, mandi prices, marketplace and a multilingual assistant."
readme = "Readme.md"
requires-python = ">=3.10,<3.14"
license = { text = "Proprietary" }
authors = [
  { name = "Abhishek Chourasia" },
  { name = "Goutam Mandloi" },
  { name = "Shivpratap Singh Panwar" },
]
dependencies = [
  # Web
  "Flask>=3.0",
  "Flask-SQLAlchemy>=3.1",
  "SQLAlchemy>=2.0",
  "Werkzeug>=3.0",
  "gunicorn>=21.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "click>=8.1",
  # Database drivers (SQLite is built in; MySQL optional)
  "mysql-connector-python>=8.0",
  # ML / data
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
  # Disease detection (image models)
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.40",
  "Pillow>=10.0",
  # LLM providers (either may be left unused)
  "anthropic>=0.40",
  "openai>=1.40",
  # Reports
  "reportlab>=4.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.5",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.uv]
# CPU-only PyTorch wheels are much smaller than the default CUDA builds.
# Remove this block (or change the index) to install a GPU build.
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.setuptools]
packages = ["krishidisha", "krishidisha.blueprints", "krishidisha.services", "ml", "api"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
